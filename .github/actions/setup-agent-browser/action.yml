name: Set up agent-browser
description: >
  Installs the agent-browser CLI and its browser, restoring the browser
  download from the cache when this version has been installed before.

runs:
  using: composite
  steps:
    - name: Install the CLI
      id: cli
      shell: bash
      run: |
        npm install -g agent-browser
        echo "version=$(agent-browser --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

    - name: Restore the browser
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.agent-browser/browsers
        key: agent-browser-${{ runner.os }}-${{ steps.cli.outputs.version }}

    # Also installs the system libraries the browser needs, which the cache
    # does not hold.
    - name: Install the browser
      shell: bash
      run: agent-browser install --with-deps

    - name: Save the browser
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.agent-browser/browsers
        key: ${{ steps.restore.outputs.cache-primary-key }}
